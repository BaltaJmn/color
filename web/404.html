<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Chroma</title>
<style>
  :root { --bg: #F3F3F3; --surface: #FFFFFF; --ink: #111111; --muted: #595959; --line: #D0D0D0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --surface: #1C1C1C; --ink: #F2F2F2; --muted: #A8A8A8; --line: #333333; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 420px; width: 100%; }
  .strip { display: flex; height: 24px; border-radius: 12px; overflow: hidden; margin-bottom: 28px; }
  .strip span { flex: 1; }
  h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 10px; }
  p { color: var(--muted); margin: 0 0 28px; }
  .stores { display: flex; flex-direction: column; gap: 10px; }
  .stores a {
    display: block; text-align: center; padding: 14px; border-radius: 26px; text-decoration: none;
    font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  }
  .home { color: var(--ink); }
</style>
</head>
<body>
<main>
  <div class="strip">
    <span style="background:#E07A5F"></span><span style="background:#F2CC8F"></span>
    <span style="background:#81B29A"></span><span style="background:#5B8DB8"></span>
    <span style="background:#3D5A80"></span><span style="background:#C77DC4"></span>
    <span style="background:#DCC6A0"></span>
  </div>
  <h1 id="title"></h1>
  <p id="text"></p>
  <div class="stores" id="stores" hidden>
    <a href="https://play.google.com/store/apps/details?id=com.baltajmn.color">Google Play</a>
    <a id="appstore" href="#">App Store</a>
  </div>
</main>
<script>
  // GitHub Pages serves this page for any path it does not know, so it is the invite landing too:
  // with the app installed the link never gets here, it opens the app instead.
  var APP_STORE_ID = ""; // store/servidor.md: fill in once the app exists in App Store Connect.
  var T = {
    en: ["You have been invited to Chroma", "One photo a day, one color you choose. Install Chroma, then open this link again to send the request.", "This page does not exist."],
    es: ["Te han invitado a Chroma", "Una foto al día, un color que eliges. Instala Chroma y vuelve a abrir este enlace para enviar la solicitud.", "Esta página no existe."],
    pt: ["Você foi convidado para o Chroma", "Uma foto por dia, uma cor que você escolhe. Instale o Chroma e abra este link de novo para enviar o pedido.", "Esta página não existe."],
    de: ["Du wurdest zu Chroma eingeladen", "Ein Foto am Tag, eine Farbe, die du wählst. Installiere Chroma und öffne diesen Link dann noch einmal, um die Anfrage zu senden.", "Diese Seite gibt es nicht."],
    fr: ["On t'a invité sur Chroma", "Une photo par jour, une couleur que tu choisis. Installe Chroma, puis rouvre ce lien pour envoyer la demande.", "Cette page n'existe pas."]
  };
  var lang = (navigator.language || "en").slice(0, 2);
  var t = T[lang] || T.en;
  document.documentElement.lang = T[lang] ? lang : "en";
  var invite = /^\/i\/[0-9a-fA-F]{10}\/?$/.test(location.pathname);
  if (invite) {
    document.getElementById("title").textContent = t[0];
    document.getElementById("text").textContent = t[1];
    document.getElementById("stores").hidden = false;
    var apple = document.getElementById("appstore");
    if (APP_STORE_ID) apple.href = "https://apps.apple.com/app/id" + APP_STORE_ID; else apple.remove();
  } else {
    document.getElementById("title").textContent = t[2];
    var home = document.createElement("a");
    home.href = "/"; home.className = "home"; home.textContent = "Chroma";
    document.getElementById("text").appendChild(home);
  }
</script>
</body>
</html>
