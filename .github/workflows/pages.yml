name: pages

# La web (política ahora, invitaciones en v1.1) vive en web/ y se publica tal cual.
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # La v3 mete las carpetas ocultas en el artefacto, y web/.well-known tiene que ir. Antes de subir
      # de versión, comprobar que siguen entrando: sin ellas los enlaces dejan de abrir la app.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
