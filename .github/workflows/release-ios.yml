name: Release to TestFlight

# Same trigger as the Play workflow: one tag ships both stores.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    # macos-26 and not macos-15: Compose links against UIKit classes that only exist from the
    # iOS 26 SDK on, so an older image fails the archive with undefined symbols.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The "Compile Kotlin Framework" run script phase shells out to ./gradlew, so the JDK has to
      # be on PATH before xcodebuild starts, not inside it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Archive and upload
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DIST_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          DIST_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail

          # An App Store Connect API key instead of an Apple ID: `-allowProvisioningUpdates` can
          # then create the development certificate and the provisioning profiles itself, so no
          # .mobileprovision ever has to live in a secret. The distribution certificate cannot be
          # left to it: see the keychain below.
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$PRIVATE_KEY" > "$KEY_PATH"

          AUTH=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$KEY_PATH"
            -authenticationKeyID "$KEY_ID"
            -authenticationKeyIssuerID "$ISSUER_ID"
          )

          # The same version and build number as the Play release of this tag: both come from the
          # Android build file, so the two stores cannot drift apart.
          VERSION_NAME=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' androidApp/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' androidApp/build.gradle.kts)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::No versionName or versionCode in androidApp/build.gradle.kts"
            exit 1
          fi

          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Chroma.xcarchive" \
            "${AUTH[@]}" \
            TEAM_ID="$TEAM_ID" \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$VERSION_CODE"

          # Without a local distribution identity Xcode signs the export in the cloud, and that path
          # breaks on this team: it hands codesign the designated requirement as an argument with the
          # certificate name in it, Foundation decomposes the "é" of "Jiménez" on the way (NFD), and
          # App Store Connect rejects a requirement that no longer matches the certificate
          # (ITMS-90035). With the private key here, codesign derives the requirement itself.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # `destination: upload` hands the build straight to App Store Connect, which saves
          # exporting an ipa only to feed it to altool in the next step.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Chroma.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            "${AUTH[@]}"

      - name: Shred the keys
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/dist.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
